name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  affected:
    name: Lint, test, build, typecheck (affected)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx affected base
        uses: nrwl/nx-set-shas@v4

      - name: Run affected tasks
        run: pnpm exec nx affected -t lint test build typecheck

  e2e:
    name: api-e2e (Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Boots the Auth/Firestore/Storage emulators, then runs the suite. The
      # api is started by Playwright's webServer; its fake-mode video env lives
      # in apps/api-e2e/playwright.config.ts, so no GCP credentials are needed.
      - name: Run api-e2e against the Firebase emulators
        run: pnpm exec firebase emulators:exec --project demo-learnwren 'pnpm nx e2e api-e2e'
