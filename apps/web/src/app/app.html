<a
  href="#main-content"
  class="sr-only rounded bg-bg-2 px-4 py-2 text-ink shadow focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:outline-none focus:ring-2 focus:ring-ochre"
>
  Skip to content
</a>
@if (showHeader()) {
  <app-header />
  <main id="main-content" tabindex="-1" class="bg-bg text-ink focus-ring">
    <router-outlet />
  </main>
} @else {
  <main
    id="main-content"
    tabindex="-1"
    class="flex min-h-screen flex-col items-center justify-center bg-bg text-ink focus-ring"
  >
    <router-outlet />
  </main>
}
