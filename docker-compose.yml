# Learn Wren self-hosting stack (US-09-04). One command: `docker compose up -d`.
# Settings come from .env — copy .env.example to .env first. Every value has a
# working default for a single machine; see docs/self-hosting.md.
#
#   web         nginx: the Angular build, /api → api
#   api         NestJS: built-in accounts, ffmpeg video pipeline, S3 client,
#               public-image route
#   postgres    the data store (never published to the host)
#   objectstore S3-compatible object store (RustFS; never published to the host)
#
# No Firebase anywhere: data lives in Postgres, accounts are the api's own
# (LEARNWREN_IDENTITY=local) and files live in the object store.
#
# UPGRADING FROM AN EMULATOR-BASED INSTALL: data is NOT migrated. The new stack
# starts with an empty Postgres; the old `emulator-data` volume is left
# untouched. You MUST start it with
#     docker compose up -d --build --remove-orphans
# or the old emulators container keeps running and serving your old data on
# unauthenticated ports 4000/8080/9099. `docker compose rm emulators` will not
# work (the service is gone from this file); use
#     docker rm -f <project>-emulators-1
#
# First run: set LEARNWREN_WEB_BIND=127.0.0.1 (or firewall the port) until you
# have registered the LEARNWREN_BOOTSTRAP_ADMIN_EMAIL account; whoever
# registers it first becomes ADMIN. See docs/self-hosting.md "First run".

x-buckets: &buckets
  LEARNWREN_VIDEO_SOURCE_BUCKET: learnwren-source
  LEARNWREN_VIDEO_OUTPUT_BUCKET: learnwren-output
  LEARNWREN_MATERIALS_BUCKET: learnwren-materials
  LEARNWREN_COVER_BUCKET: learnwren-covers
  LEARNWREN_PICTURE_BUCKET: learnwren-pictures

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "${LEARNWREN_POSTGRES_PASSWORD:-learnwren-change-me}"
      POSTGRES_DB: learnwren
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnwren"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  objectstore:
    # S3-compatible object store (RustFS, Apache-2.0; MinIO-compatible API).
    # Deliberately NOT published: browsers reach files only through the web
    # container — /api for uploads, downloads and video segments, and
    # /api/media for the public cover and profile images.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: "${LEARNWREN_S3_ACCESS_KEY:-learnwren}"
      RUSTFS_SECRET_KEY: "${LEARNWREN_S3_SECRET_KEY:-learnwren-change-me}"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    environment:
      <<: *buckets
      LEARNWREN_DATA_STORE: postgres
      LEARNWREN_IDENTITY: local
      LEARNWREN_POSTGRES_URL: "postgres://postgres:${LEARNWREN_POSTGRES_PASSWORD:-learnwren-change-me}@postgres:5432/learnwren"
      # First admin: this account becomes ADMIN when it logs in after verifying.
      LEARNWREN_BOOTSTRAP_ADMIN_EMAIL: "${LEARNWREN_BOOTSTRAP_ADMIN_EMAIL:-}"
      # The origin browsers use: emailed links, CORS and the public image URLs.
      # Set LEARNWREN_PUBLIC_URL in .env behind an HTTPS proxy. Compose cannot
      # reference another variable here, so the same default repeats below.
      LEARNWREN_PUBLIC_URL: "${LEARNWREN_PUBLIC_URL:-http://${LEARNWREN_HOST:-localhost}:${LEARNWREN_WEB_PORT:-8000}}"
      LEARNWREN_CORS_ORIGINS: "${LEARNWREN_PUBLIC_URL:-http://${LEARNWREN_HOST:-localhost}:${LEARNWREN_WEB_PORT:-8000}}"
      # Real video: ffmpeg transcodes in-process and segments are served
      # through /api (no signing credentials needed). See docs/self-hosting.md.
      LEARNWREN_VIDEO_TRANSCODER: ffmpeg
      # Object storage: S3-compatible RustFS, reached only from inside the stack.
      # The api creates its buckets on boot.
      LEARNWREN_OBJECT_STORAGE: s3
      LEARNWREN_S3_ENDPOINT: http://objectstore:9000
      LEARNWREN_S3_ACCESS_KEY: "${LEARNWREN_S3_ACCESS_KEY:-learnwren}"
      LEARNWREN_S3_SECRET_KEY: "${LEARNWREN_S3_SECRET_KEY:-learnwren-change-me}"
      # 'firebase' is the historical name for "the real store" (here: S3);
      # outside production the covers/pictures/materials default to in-memory fakes.
      LEARNWREN_COVER_STORAGE: firebase
      LEARNWREN_PICTURE_STORAGE: firebase
      LEARNWREN_MATERIALS_STORAGE_FAKE: "false"
      # Public images are served by the api from these two buckets only.
      LEARNWREN_PUBLIC_BUCKETS: learnwren-covers,learnwren-pictures
      LEARNWREN_COVER_PUBLIC_BASE_URL: "${LEARNWREN_PUBLIC_URL:-http://${LEARNWREN_HOST:-localhost}:${LEARNWREN_WEB_PORT:-8000}}/api/media/learnwren-covers"
      LEARNWREN_PICTURE_PUBLIC_BASE_URL: "${LEARNWREN_PUBLIC_URL:-http://${LEARNWREN_HOST:-localhost}:${LEARNWREN_WEB_PORT:-8000}}/api/media/learnwren-pictures"
      LEARNWREN_EMAIL_TRANSPORT: "${LEARNWREN_EMAIL_TRANSPORT:-console}"
      LEARNWREN_EMAIL_FROM: "${LEARNWREN_EMAIL_FROM:-noreply@learnwren.local}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      LEARNWREN_STORAGE_QUOTA_GB: "${LEARNWREN_STORAGE_QUOTA_GB:-}"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${LEARNWREN_WEB_BIND:-0.0.0.0}:${LEARNWREN_WEB_PORT:-8000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  objectstore-data:
