<!-- Drawer mode is a collapsible INLINE panel, not an overlay: the old
     backdrop/focus-trap markup relied on .is-drawer/.is-open CSS that never
     existed, leaving the toggle inert and trapping keyboard focus. -->
<aside
  aria-label="Course outline"
  class="course-outline"
  [attr.hidden]="!outlineOpen() ? '' : null"
>
  @if (courseComplete()) {
    <p data-testid="course-complete-banner" class="course-complete-banner text-ink" role="status">
      &#127881; Course completed
    </p>
  }
  @for (m of outline().modules; track m.id) {
    <section>
      <h3>
        {{ m.title }}
        @if (isModuleComplete(m)) {
          <span data-testid="module-complete" aria-label="Module completed" class="text-ink-2">&#10003;</span>
        }
      </h3>
      <ol>
        @for (l of m.lessons; track l.id) {
          <li>
            <button
              type="button"
              data-testid="outline-row"
              [attr.aria-current]="l.id === activeLessonId() ? 'page' : null"
              [attr.aria-disabled]="l.videoState !== 'READY' ? 'true' : null"
              [class.is-active]="l.id === activeLessonId()"
              [class.is-processing]="l.videoState !== 'READY'"
              (click)="onRowClick(l.id, l.videoState)"
            >
              @if (l.completedAt) {
                <span aria-label="Completed">&#10003;</span>
              }
              <span>{{ l.title }}</span>
              @if (l.videoState !== 'READY') {
                <span> (processing)</span>
              }
            </button>
            @if (processingNoticeFor() === l.id) {
              <p data-testid="processing-notice">This lesson's video is still being processed.</p>
            }
          </li>
        }
      </ol>
    </section>
  }
</aside>
