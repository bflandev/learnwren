<div class="relative overflow-hidden rounded-lg bg-black">
  <video
    #playerEl
    controls
    preload="metadata"
    crossorigin="anonymous"
    class="block w-full"
    data-testid="video-player"
  >
    @if (captions(); as c) {
      <track kind="subtitles" [src]="c.src" [srclang]="c.srclang" [label]="c.label" />
    }
  </video>
  @if (devPlaceholder()) {
    <div
      class="absolute inset-0 flex items-center justify-center bg-black/80 p-4 text-center text-sm text-white"
      data-testid="video-player-dev-placeholder"
    >
      Video preview is unavailable in local dev mode.
    </div>
  }
</div>
@if (error(); as msg) {
  <div
    class="mt-2 flex items-center gap-2 text-sm text-bad"
    role="alert"
    data-testid="video-player-error"
  >
    <span>{{ msg }}</span>
    <button
      lwButton
      type="button"
      (click)="retry()"
      data-testid="video-player-retry"
    >
      Try again
    </button>
  </div>
}
