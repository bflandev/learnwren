<span
  hlmBadge
  [variant]="variant()"
  data-testid="video-state-badge"
  [attr.data-video-id]="video().id"
  [attr.data-state]="video().state"
>
  @if (showSpinner()) {
    <span
      class="spinner mr-1 inline-block h-3 w-3 animate-spin rounded-full border-2 border-line border-t-ochre align-[-2px]"
      aria-hidden="true"
    ></span>
  }
  {{ label() }}
</span>
@if (canRemove()) {
  <button
    hlmBtn
    variant="destructive"
    size="sm"
    type="button"
    data-testid="video-remove"
    class="ml-2"
    (click)="removeRequested.emit()"
  >
    Remove video
  </button>
}
