<div class="mx-auto w-full max-w-2xl p-6">
  <header class="mb-6 flex items-center justify-between gap-4">
    <h1 class="text-2xl">Create course</h1>
    <a hlmBtn variant="ghost" routerLink="/courses">Cancel</a>
  </header>

  <hlm-card class="p-6">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <label class="block">
        <span hlmLabel>Title</span>
        <input
          hlmInput
          data-testid="title"
          formControlName="title"
          maxlength="100"
          class="mt-1"
        />
      </label>
      @for (e of fieldErrors()['title'] ?? []; track e) {
        <p class="error text-sm text-bad">{{ e }}</p>
      }

      <label class="block">
        <span hlmLabel>Short description</span>
        <textarea
          hlmTextarea
          data-testid="description"
          formControlName="description"
          maxlength="500"
          rows="3"
          class="mt-1"
        ></textarea>
      </label>
      @for (e of fieldErrors()['description'] ?? []; track e) {
        <p class="error text-sm text-bad">{{ e }}</p>
      }

      <label class="block">
        <span hlmLabel>Long description (optional)</span>
        <textarea
          hlmTextarea
          formControlName="longDescription"
          maxlength="5000"
          rows="5"
          class="mt-1"
        ></textarea>
      </label>

      <label class="block">
        <span hlmLabel>Category (optional)</span>
        <select hlmInput formControlName="category" class="mt-1">
          <option value="">—</option>
          @for (c of categories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </label>

      <label class="block">
        <span hlmLabel>Difficulty (optional)</span>
        <select hlmInput formControlName="difficulty" class="mt-1">
          <option value="">—</option>
          @for (d of difficulties; track d) {
            <option [value]="d">{{ d }}</option>
          }
        </select>
      </label>

      @if (genericError()) {
        <p class="error text-sm text-bad" data-testid="generic-error">{{ genericError() }}</p>
      }

      <button
        hlmBtn
        data-testid="submit"
        type="submit"
        class="w-full justify-center"
        [disabled]="form.invalid || busy()"
      >
        {{ busy() ? 'Creating…' : 'Create' }}
      </button>
    </form>
  </hlm-card>
</div>
