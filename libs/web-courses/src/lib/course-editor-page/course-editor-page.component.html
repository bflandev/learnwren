<div class="mx-auto w-full max-w-4xl p-6">
  <header class="mb-5 flex items-center justify-between">
    <a routerLink="/courses" class="text-sm text-ochre hover:underline">← My Courses</a>
    <span class="flex gap-4">
      <a
        [routerLink]="['/courses', cid(), 'students']"
        data-testid="view-students"
        class="text-sm text-ochre hover:underline"
        >Students</a
      >
      <a
        [routerLink]="['/courses', cid(), 'analytics']"
        data-testid="view-analytics"
        class="text-sm text-ochre hover:underline"
        >Analytics</a
      >
    </span>
  </header>

  @if (tree() === null) {
    <div class="flex flex-col gap-3">
      <hlm-skeleton label="Loading course" class="h-16 w-full" />
      <hlm-skeleton class="h-40 w-full" />
      <hlm-skeleton class="h-24 w-full" />
    </div>
  } @else {
    <div class="space-y-5">
      <lib-course-publish-bar
        [course]="tree()!.course"
        (courseUpdated)="onCourseUpdated($event)"
        (requestConfirm)="requestPublishConfirm($event)"
      />
      @if (tree()!.course.status === 'DRAFT') {
        <lib-publish-eligibility-panel
          (jumpToModule)="onJumpToModule($event)"
          (jumpToLesson)="onJumpToLesson($event)"
        />
      }

      <lib-course-cover-uploader
        [courseId]="tree()!.course.id"
        [currentCoverUrl]="tree()!.course.coverImageUrl"
        (coverChanged)="onCoverChanged($event)"
      ></lib-course-cover-uploader>

      <lib-course-meta-panel
        [course]="tree()!.course"
        (update)="onUpdateCourse($event)"
        (deleteCourse)="requestDeleteCourse()"
      ></lib-course-meta-panel>

      <div class="flex items-center justify-between gap-4">
        <h2 class="text-lg">Modules</h2>
        @if (!addingModule()) {
          <button
            hlmBtn
            variant="secondary"
            data-testid="add-module"
            type="button"
            (click)="startAddModule()"
          >
            Add module
          </button>
        }
      </div>

      @if (addingModule()) {
        <form
          class="flex items-center gap-2"
          (submit)="$event.preventDefault(); confirmAddModule()"
        >
          <label class="sr-only" for="new-module-title">Module title</label>
          <input
            hlmInput
            id="new-module-title"
            data-testid="new-module-title"
            type="text"
            class="flex-1"
            placeholder="Module title"
            [value]="newModuleTitle()"
            (input)="newModuleTitle.set($any($event.target).value)"
          />
          <button hlmBtn data-testid="add-module-confirm" type="submit">Add</button>
          <button
            hlmBtn
            variant="ghost"
            data-testid="add-module-cancel"
            type="button"
            (click)="cancelAddModule()"
          >
            Cancel
          </button>
        </form>
      }

      <lib-module-tree
        [nodes]="nodes()"
        [courseId]="cid()"
        [coursePublished]="tree()?.course?.status === 'PUBLISHED'"
        (reorderModules)="onReorderModules($event)"
        (renameModule)="onRenameModule($event)"
        (deleteModule)="requestDeleteModule($event)"
        (addLesson)="onAddLesson($event)"
        (renameLesson)="onRenameLesson($event)"
        (deleteLesson)="requestDeleteLesson($event)"
        (reorderLessons)="onReorderLessons($event)"
        (videoChanged)="refresh()"
        (videoStateChanged)="onVideoStateChanged($event)"
        (notifyModule)="onNotifyModule($event)"
      ></lib-module-tree>
    </div>
  }

  @if (error()) {
    <hlm-alert severity="error" class="mt-4" data-testid="editor-error">
      {{ error() }}
    </hlm-alert>
  }

  @if (notice()) {
    <hlm-alert severity="success" class="mt-4" data-testid="editor-notice">
      {{ notice() }}
    </hlm-alert>
  }
</div>
