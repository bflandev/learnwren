<hlm-card
  class="publish-bar flex flex-wrap items-center gap-3 p-4"
  data-testid="publish-bar"
>
  <span class="title text-lg text-ink">{{ course().title }}</span>
  <span
    hlmBadge
    data-testid="publish-bar-pill"
    [variant]="status() === 'PUBLISHED' ? 'success' : status() === 'ARCHIVED' ? 'default' : 'warning'"
    >{{ status() }}</span
  >

  <span class="flex-1"></span>

  <button
    hlmBtn
    type="button"
    data-testid="publish-bar-primary"
    [disabled]="primaryDisabled()"
    (click)="onPrimary()"
    [attr.title]="
      primaryKind() === 'publish' && !primaryDisabled()
        ? null
        : primaryKind() === 'publish'
          ? 'Resolve the issues below first'
          : null
    "
  >
    {{ primaryLabel() }}
  </button>

  @if (canArchive()) {
    <button
      hlmBtn
      variant="secondary"
      type="button"
      data-testid="publish-bar-archive"
      [disabled]="inFlight()"
      (click)="onArchive()"
    >
      Archive course…
    </button>
  }

  @if (genericError(); as msg) {
    <div class="banner w-full text-sm text-bad" role="alert">{{ msg }}</div>
  }
</hlm-card>
