<div class="lesson-item rounded border border-line bg-bg p-3" data-testid="lesson-item">
  <div class="flex flex-wrap items-center gap-2">
    @if (editing()) {
      <input
        hlmInput
        lwAutofocus
        data-testid="lesson-rename-input"
        [attr.maxlength]="lessonTitleMax"
        type="text"
        aria-label="Lesson title"
        class="flex-1"
        [ngModel]="draftTitle()"
        (ngModelChange)="draftTitle.set($event)"
        (blur)="commit()"
        (lwEnter)="commit(); refocus('[data-testid=lesson-title]')"
        (keydown.escape)="cancel(); refocus('[data-testid=lesson-title]')"
      />
    } @else {
      <button
        type="button"
        data-testid="lesson-title"
        class="flex-1 text-left text-ink"
        (click)="startEdit()"
      >
        {{ lesson().title }}
      </button>
    }
    <button
      hlmBtn
      variant="destructive"
      size="sm"
      data-testid="lesson-delete"
      type="button"
      (click)="delete.emit()"
    >
      Delete
    </button>
  </div>

  <div class="mt-3 space-y-3">
    @if (lesson().videoId) {
      @if (video(); as v) {
        @if (v.state === 'READY') {
          <lib-video-player [videoId]="v.id" [captions]="captionTracks()" />
        } @else {
          <lib-video-state-badge
            [video]="v"
            (stateChanged)="onVideoStateChanged($event)"
            (removeRequested)="requestVideoRemoval()"
          />
        }
      } @else if (videoLoadFailed()) {
        <p data-testid="video-load-error" class="text-sm text-bad" role="alert">
          Couldn't load this lesson's video. Reload the page to try again.
        </p>
      }
      @if (videoActionError(); as err) {
        <p data-testid="video-action-error" class="text-sm text-bad">{{ err }}</p>
      }
      <lib-captions-panel [videoId]="lesson().videoId!" (tracksChange)="onCaptionsMeta($event)" />
    } @else {
      <lib-video-upload
        [courseId]="courseId()"
        [moduleId]="lesson().moduleId"
        [lessonId]="lesson().id"
        (uploaded)="onVideoUploaded()"
      />
    }
    <lib-materials-list
      [courseId]="courseId()"
      [moduleId]="lesson().moduleId"
      [lessonId]="lesson().id"
    />
  </div>

</div>
