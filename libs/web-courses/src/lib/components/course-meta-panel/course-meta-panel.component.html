<hlm-card class="course-meta p-5" data-testid="course-meta">
  <h2 class="mb-3 text-lg">Course details</h2>
  <div class="space-y-4">
    <hlm-form-field>
      <label hlmLabel for="course-title-input">Title</label>
      <input
        hlmInput
        hlmFormFieldControl
        id="course-title-input"
        data-testid="course-title"
        type="text"
        [ngModel]="draftTitle()"
        (ngModelChange)="draftTitle.set($event)"
        (blur)="commitTitle()"
        maxlength="100"
      />
    </hlm-form-field>

    <hlm-form-field>
      <label hlmLabel for="course-description-input">Description</label>
      <textarea
        hlmTextarea
        hlmFormFieldControl
        id="course-description-input"
        data-testid="course-description"
        [ngModel]="draftDescription()"
        (ngModelChange)="draftDescription.set($event)"
        (blur)="commitDescription()"
        maxlength="500"
        rows="3"
      ></textarea>
    </hlm-form-field>

    <button
      hlmBtn
      variant="destructive"
      data-testid="delete-course"
      type="button"
      (click)="deleteCourse.emit()"
    >
      Delete course
    </button>
  </div>
</hlm-card>
