<hlm-card class="module-item p-4" data-testid="module-item">
  <header class="mb-3 flex flex-wrap items-center gap-2">
    @if (editing()) {
      <input
        hlmInput
        lwAutofocus
        data-testid="module-rename-input"
        [attr.maxlength]="moduleTitleMax"
        type="text"
        aria-label="Module title"
        class="flex-1"
        [ngModel]="draftTitle()"
        (ngModelChange)="draftTitle.set($event)"
        (blur)="commit()"
        (lwEnter)="commit(); refocus('[data-testid=module-title]')"
        (keydown.escape)="cancel(); refocus('[data-testid=module-title]')"
      />
    } @else {
      <button
        type="button"
        data-testid="module-title"
        class="flex-1 text-left font-serif text-lg text-ink"
        (click)="startEdit()"
      >
        {{ module().title }}
      </button>
    }
    <button
      hlmBtn
      variant="destructive"
      data-testid="module-delete"
      type="button"
      (click)="deleteModule.emit()"
    >
      Delete module
    </button>
    @if (canNotify()) {
      <button
        hlmBtn
        variant="ghost"
        data-testid="module-notify"
        type="button"
        [disabled]="notifying()"
        (click)="notifyModule.emit()"
      >
        {{ notifying() ? 'Sending…' : 'Notify students' }}
      </button>
    } @else if (coursePublished() && alreadyNotified()) {
      <span class="text-xs text-ink-3" data-testid="module-notified">
        Students notified {{ module().studentsNotifiedAt | date: 'mediumDate' }}
      </span>
    }
  </header>

  <lib-lesson-list
    [lessons]="lessons()"
    [courseId]="courseId()"
    (reorder)="reorderLessons.emit($event)"
    (renameLesson)="renameLesson.emit($event)"
    (deleteLesson)="deleteLesson.emit($event)"
    (videoChanged)="videoChanged.emit()"
    (videoStateChanged)="videoStateChanged.emit($event)"
  ></lib-lesson-list>

  @if (addingLesson()) {
    <input
      hlmInput
      lwAutofocus
        data-testid="add-lesson-input"
      [attr.maxlength]="lessonTitleMax"
      type="text"
      aria-label="New lesson title"
      class="mt-3"
      [ngModel]="newLessonTitle()"
      (ngModelChange)="newLessonTitle.set($event)"
      (blur)="commitAddLesson()"
      (lwEnter)="commitAddLesson(); refocus('[data-testid=add-lesson]')"
      (keydown.escape)="addingLesson.set(false); refocus('[data-testid=add-lesson]')"
      placeholder="New lesson title"
    />
  } @else {
    <button
      hlmBtn
      variant="ghost"
      data-testid="add-lesson"
      type="button"
      class="mt-3"
      (click)="beginAddLesson()"
    >
      Add lesson
    </button>
  }
</hlm-card>
