@if (currentUser(); as me) {
  <div class="flex items-center gap-4">
    <hlm-avatar
      size="lg"
      data-testid="uploader-avatar"
      [src]="me.photoUrl"
      [alt]="me.displayName"
      [attr.data-tone]="avatarTone()"
    >
      <span data-testid="uploader-avatar-initials" class="text-sm font-medium">{{
        avatarInitials()
      }}</span>
    </hlm-avatar>

    <div class="flex flex-col gap-2">
      @switch (state()) {
        @case ('idle') {
          <label class="cursor-pointer underline" for="profile-picture-input">
            <input
              id="profile-picture-input"
              class="sr-only"
              type="file"
              accept="image/jpeg,image/png"
              (change)="onFileSelected($any($event.target).files[0])"
            />
            {{ me.photoUrl ? 'Replace picture' : 'Upload picture' }}
          </label>
          @if (me.photoUrl) {
            <button type="button" class="underline text-left" (click)="onRemove()">Remove picture</button>
          }
        }
        @case ('uploading') {
          <p>Uploading…</p>
        }
        @case ('failed') {
          <p class="text-bad">{{ errorReason() }}</p>
          <button type="button" class="underline text-left" (click)="dismissError()">Dismiss</button>
        }
      }
    </div>
  </div>
}
