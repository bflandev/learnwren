<section class="mx-auto mt-12 max-w-md rounded border border-slate-200 bg-white p-6">
  <h1 class="text-xl font-semibold mb-4">Create an account</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <label class="block">
      <span class="text-sm font-medium">Display name</span>
      <input
        type="text"
        formControlName="displayName"
        autocomplete="name"
        class="mt-1 w-full rounded border border-slate-300 px-2 py-1.5"
        required
      />
    </label>

    <label class="block">
      <span class="text-sm font-medium">Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        class="mt-1 w-full rounded border border-slate-300 px-2 py-1.5"
        required
      />
    </label>

    <label class="block">
      <span class="text-sm font-medium">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        class="mt-1 w-full rounded border border-slate-300 px-2 py-1.5"
        required
      />
      @if (passwordHints().length > 0) {
        <ul class="mt-1 text-xs text-slate-700 list-disc list-inside">
          @for (hint of passwordHints(); track hint) {
            <li>{{ hint }}</li>
          }
        </ul>
      }
    </label>

    @if (error()) {
      <p class="text-sm text-red-700" role="alert">{{ error() }}</p>
    }

    <button
      type="submit"
      class="w-full rounded bg-slate-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-50"
      [disabled]="form.invalid || busy()"
    >
      @if (busy()) { Creating account… } @else { Create account }
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-700">
    Already have an account? <a routerLink="/login" class="text-blue-700 underline">Sign in</a>
  </p>
</section>
