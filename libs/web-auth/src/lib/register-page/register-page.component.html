<section class="w-full max-w-md rounded-lg border border-line bg-bg-2 p-6">
  <h1 class="mb-4 text-xl">Create an account</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <hlm-form-field>
      <label hlmLabel for="register-display-name">Display name</label>
      <input
        hlmInput
        hlmFormFieldControl
        id="register-display-name"
        type="text"
        formControlName="displayName"
        autocomplete="name"
        required
      />
    </hlm-form-field>

    <hlm-form-field>
      <label hlmLabel for="register-email">Email</label>
      <input
        hlmInput
        hlmFormFieldControl
        id="register-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        required
      />
    </hlm-form-field>

    <hlm-form-field>
      <label hlmLabel for="register-password">Password</label>
      <input
        hlmInput
        hlmFormFieldControl
        id="register-password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        required
      />
      @if (passwordHints().length > 0) {
        <ul hlmFormFieldHint class="list-inside list-disc">
          @for (hint of passwordHints(); track hint) {
            <li>{{ hint }}</li>
          }
        </ul>
      }
    </hlm-form-field>

    @if (error()) {
      <hlm-alert severity="error">{{ error() }}</hlm-alert>
    }

    <button
      hlmBtn
      type="submit"
      class="w-full"
      [disabled]="form.invalid || busy()"
    >
      @if (busy()) {
        <hlm-spinner size="sm" />
        Creating account…
      } @else {
        Create account
      }
    </button>
  </form>

  <p class="mt-4 text-sm text-ink-2">
    Already have an account?
    <a routerLink="/login" class="text-ochre hover:underline">Sign in</a>
  </p>
</section>
