<a [routerLink]="['/catalog', course().id]" class="block no-underline">
  <hlm-card class="overflow-hidden">
    <lw-cover
      [glyph]="course().title.charAt(0)"
      [tone]="coverTone()"
      [height]="96"
      [imageUrl]="course().coverImageUrl"
      [alt]="course().title" />
    <div class="flex flex-col items-start gap-2 p-4">
      <h3 class="text-base text-ink">{{ course().title }}</h3>
      <div class="byline flex items-center gap-2">
        <hlm-avatar
          size="sm"
          data-testid="card-instructor-avatar"
          [src]="course().instructorPhotoUrl"
          [alt]="course().instructorDisplayName"
          [attr.data-tone]="avatarTone()"
        >
          <span data-testid="card-avatar-initials" class="text-xs font-medium">{{
            avatarInitials()
          }}</span>
        </hlm-avatar>
        <p class="text-sm text-ink-2">{{ course().instructorDisplayName }}</p>
      </div>
      @if (course().difficulty) {
        <span hlmBadge data-testid="card-difficulty-badge">{{ course().difficulty }}</span>
      }
      @if (completed()) {
        <span hlmBadge data-testid="card-completed-pill" variant="success">Completed</span>
      }
    </div>
  </hlm-card>
</a>
