<div class="flex flex-wrap items-center gap-3">
  <div class="flex items-center gap-2 text-sm text-ink-2">
    <span>Category</span>
    <div
      class="min-w-36"
      [hlmSelectSingle]="category() ?? ''"
      (hlmSelectSingleChange)="onCategoryChange($event)"
    >
      <!-- The trigger label is derived from the async `categories` list, so a
           deep-linked selection (/catalog?category=X) renders once the options
           arrive — same guarantee the old per-option [selected] carried. -->
      <button hlmSelectTrigger type="button" aria-label="Category" data-testid="filter-category">
        <span>{{ categoryName() ?? 'All' }}</span>
      </button>
      <ng-template hlmSelectPortal>
        <div hlmSelectContent>
          <div hlmSelectList>
            <div [hlmSelectItem]="''">All</div>
            @for (c of categories(); track c.id) {
              <div [hlmSelectItem]="c.id">{{ c.name }}</div>
            }
          </div>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="flex items-center gap-2 text-sm text-ink-2">
    <span>Difficulty</span>
    <div
      class="min-w-36"
      [hlmSelectSingle]="difficulty() ?? ''"
      (hlmSelectSingleChange)="onDifficultyChange($event)"
    >
      <button hlmSelectTrigger type="button" aria-label="Difficulty" data-testid="filter-difficulty">
        <span>{{ difficulty() ?? 'All' }}</span>
      </button>
      <ng-template hlmSelectPortal>
        <div hlmSelectContent>
          <div hlmSelectList>
            <div [hlmSelectItem]="''">All</div>
            @for (d of difficulties; track d) {
              <div [hlmSelectItem]="d">{{ d }}</div>
            }
          </div>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="flex items-center gap-2 text-sm text-ink-2">
    <span>Sort</span>
    <div
      class="min-w-36"
      [hlmSelectSingle]="sort()"
      (hlmSelectSingleChange)="onSortChange($event)"
    >
      <button hlmSelectTrigger type="button" aria-label="Sort" data-testid="filter-sort">
        <span>{{ sort() }}</span>
      </button>
      <ng-template hlmSelectPortal>
        <div hlmSelectContent>
          <div hlmSelectList>
            @for (s of sorts; track s) {
              <div [hlmSelectItem]="s">{{ s }}</div>
            }
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</div>
