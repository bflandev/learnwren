<section class="border-t border-line bg-bg-2">
  <figure class="mx-auto flex max-w-4xl flex-col gap-6 px-6 py-20 md:flex-row md:items-start">
    <hlm-avatar size="lg" [attr.data-tone]="avatarTone">
      <span class="text-xs font-medium">{{ avatarInitials }}</span>
    </hlm-avatar>
    <div>
      <figcaption class="text-xs tracking-wide text-ink-3">{{ testimonial.eyebrow }}</figcaption>
      <blockquote class="mt-3 font-serif text-2xl leading-snug">
        "{{ testimonial.quote }}"
      </blockquote>
      <p class="mt-4 text-xs tracking-wide text-ink-3">{{ testimonial.name }} · {{ testimonial.context }}</p>
    </div>
  </figure>
</section>
